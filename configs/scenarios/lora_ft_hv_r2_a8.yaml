# Scenario overlay: LoRA fine-tuning on HV (starting from MV baseline weights)
# Variant: r=2, alpha=8
#
# Usage:
#   uv run python scripts/run_sweep.py --base configs/default.yaml --scenario configs/scenarios/lora_ft_hv_r2_a8.yaml --seeds 42 123 999 --budgets 0 0.01 0.05 0.10 0.30 0.50 0.75

mlflow:
  enabled: true
  experiment: lora_ft_hv_r2_a8

# LoRA fine-tuning typically needs fewer epochs than full training.
train:
  epochs: 100
  lr: 3.0e-4

optimizer:
  weight_decay: 0.0

# Override dataset to HV
data:
  parquet_paths:
    - ./datasets/HVN_15000_NR_plain_4_to_32_buses.parquet
    - ./datasets/HVN_15010_NR_plain_4_to_32_buses.parquet
    - ./datasets/HVN_15020_NR_plain_4_to_32_buses.parquet

peft:
  enabled: true
  method: lora
  lora_r: 2
  lora_alpha: 8
  lora_dropout: 0.05
  lora_target_modules: ["q", "k", "v", "out"]
  train_base: false
  # MV baseline checkpoint (MLflow artifact store path)
  base_ckpt_path: ./results/mlruns/0a83691312394f0599189c399cdfb667/artifacts/run/ckpt/best.ckpt

compare:
  enabled: true
  baseline_run_id: 0a83691312394f0599189c399cdfb667
  metrics: ["test/rmse", "test/rmse_mag", "test/rmse_ang_deg"]
