# Scenario overlay: LoRA fine-tuning on HV + unfreeze prediction heads
#
# This trains:
# - LoRA adapter weights (on q/k/v/out)
# - plus the final prediction heads (theta_head, v_head, m_head)
#
# Usage:
#   python -u scripts/run_sweep.py --base configs/default.yaml --scenario configs/scenarios/lora_ft_hv_heads.yaml --seeds 42 43 44

mlflow:
  enabled: true
  experiment: lora_ft_hv_heads_100ep

train:
  epochs: 100
  lr: 3.0e-4

optimizer:
  weight_decay: 0.0

data:
  parquet_paths:
    - ./datasets/HVN_15000_NR_plain_4_to_32_buses.parquet
    - ./datasets/HVN_15010_NR_plain_4_to_32_buses.parquet
    - ./datasets/HVN_15020_NR_plain_4_to_32_buses.parquet

peft:
  enabled: true
  method: lora
  lora_r: 2
  lora_alpha: 8
  lora_dropout: 0.05
  lora_target_modules: ["q", "k", "v", "out"]
  train_base: false
  # MV baseline checkpoint (MLflow artifact store path)
  base_ckpt_path: ./results/mlruns/0a83691312394f0599189c399cdfb667/artifacts/run/ckpt/best.ckpt
  # Unfreeze final heads while keeping the rest of the base model frozen.
  unfreeze_modules: ["theta_head", "v_head", "m_head"]

compare:
  enabled: true
  baseline_run_id: 0a83691312394f0599189c399cdfb667
  metrics: ["test/rmse", "test/rmse_mag", "test/rmse_ang_deg"]
